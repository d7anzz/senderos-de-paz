<!-- Encabezado Global -->
<header class="header">
  <div class="header-inner">
    <button class="btn-menu" (click)="toggleDrawer()" aria-label="Abrir menú de navegación">
      <span class="menu-icon">☰</span>
      <span class="menu-label">Menú</span>
    </button>

    <a routerLink="/" class="logo-link">
      <img src="/logo-2.png" alt="Funeraria Senderos de Paz" class="logo-img" />
    </a>

    <a [href]="'tel:' + phone" class="btn-call-header">
      <span class="call-icon">📞</span>
      <span class="call-text">Llamar 24/7</span>
    </a>
  </div>
</header>

<!-- Drawer Global -->
<aside class="drawer" [class.drawer-open]="isDrawerOpen()">
  <div class="drawer-header">
    <h3>Secciones</h3>
    <button class="btn-close" (click)="toggleDrawer()">✕</button>
  </div>
  <nav class="drawer-nav">
    <a routerLink="/" (click)="toggleDrawer()">Inicio</a>
    <a routerLink="/about" (click)="toggleDrawer()">Sobre la Empresa</a>
    <a routerLink="/services" (click)="toggleDrawer()">Nuestros Servicios</a>
    <a routerLink="/" fragment="contacto" (click)="toggleDrawer()">Formulario de Contacto</a>
    <div class="drawer-footer">
      <p>Atención continua los 365 días del año</p>
      <a [href]="'tel:' + phone" class="drawer-phone">📞 {{ phoneFormatted }}</a>
    </div>
  </nav>
</aside>

@if (isDrawerOpen()) {
  <div class="drawer-backdrop" (click)="toggleDrawer()"></div>
}
<router-outlet />
